[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "https://www.untitledrx.com/*"
  to = "https://untitledrx.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/Home.dc.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/GENERATED_SECRET.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/oxide/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/screenshots/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scraps/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.image-slots.state.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/github.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/leaderboards/ingest"
  to = "/.netlify/functions/leaderboards-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/api/leaderboards"
  to = "/.netlify/functions/leaderboards-read"
  status = 200
  force = true


[[redirects]]
  from = "/api/leaderboards/heatmap-ingest"
  to = "/.netlify/functions/leaderboards-heatmap-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/api/leaderboards/heatmap"
  to = "/.netlify/functions/leaderboards-heatmap-read"
  status = 200
  force = true

[[redirects]]
  from = "/api/sponsors"
  to = "/.netlify/functions/sponsors-read"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat/send"
  to = "/.netlify/functions/chat-send"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat/read"
  to = "/.netlify/functions/chat-read"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat/game-ingest"
  to = "/.netlify/functions/chat-game-ingest"
  status = 200
  force = true
